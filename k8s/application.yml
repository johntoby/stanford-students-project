---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: student-api
data:
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "stanford_students"
  PORT: "8080"
  LOG_LEVEL: "info"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-credentials
  namespace: student-api
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-secret-store
    kind: SecretStore
  target:
    name: app-secret
    creationPolicy: Owner
  data:
  - secretKey: DB_USER
    remoteRef:
      key: database
      property: username
  - secretKey: DB_PASSWORD
    remoteRef:
      key: database
      property: password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stanford-api
  namespace: student-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stanford-api
  template:
    metadata:
      labels:
        app: stanford-api
    spec:
      initContainers:
      - name: migration
        image: postgres:15-alpine
        env:
        - name: PGHOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_HOST
        - name: PGPORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_PORT
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_USER
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_PASSWORD
        - name: PGDATABASE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_NAME
        command:
        - sh
        - -c
        - |
          echo "Waiting for PostgreSQL to be ready..."
          until pg_isready -h $PGHOST -p $PGPORT -U $PGUSER; do
            echo "PostgreSQL is not ready yet. Waiting..."
            sleep 2
          done
          echo "PostgreSQL is ready. Running migrations..."
          psql -h $PGHOST -p $PGPORT -U $PGUSER -d $PGDATABASE -c "
          CREATE TABLE IF NOT EXISTS students (
              id SERIAL PRIMARY KEY,
              first_name VARCHAR(100) NOT NULL,
              last_name VARCHAR(100) NOT NULL,
              email VARCHAR(100) UNIQUE NOT NULL,
              major VARCHAR(100) NOT NULL,
              gpa DECIMAL(3,2) CHECK (gpa >= 0.0 AND gpa <= 4.0),
              enrollment_date DATE,
              graduation_year INT,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          INSERT INTO students (first_name, last_name, email, major, gpa, enrollment_date, graduation_year)
          SELECT 'John', 'Doe', 'john.doe@stanford.edu', 'Computer Science', 3.8, '2021-09-01', 2025
          WHERE NOT EXISTS (SELECT 1 FROM students LIMIT 1);
          "
          echo "Migrations completed successfully"
      containers:
      - name: stanford-api
        image: stanford-students-api:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_PORT
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_NAME
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: PORT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: LOG_LEVEL
        livenessProbe:
          httpGet:
            path: /healthcheck
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthcheck
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: stanford-api-service
  namespace: student-api
spec:
  selector:
    app: stanford-api
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP