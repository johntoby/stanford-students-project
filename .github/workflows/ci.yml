name: Stanford Students API CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.golangci.yml'
      - 'config/**'
      - 'db/**'
      - 'handlers/**'
      - 'middleware/**'
      - 'models/**'
      - 'router/**'
  pull_request:
    branches: [ main ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.golangci.yml'
      - 'config/**'
      - 'db/**'
      - 'handlers/**'
      - 'middleware/**'
      - 'models/**'
      - 'router/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: false
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/stanford-students-api
  DOCKER_TAG: ${{ github.sha }}

jobs:
  ci:
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Build API
      run: |
        echo "🔨 Building Stanford Students API using Make..."
        make build-api

    - name: Run Tests
      run: |
        echo "🧪 Running tests using Make..."
        make test

    - name: Run Code Linting
      run: |
        echo "🔍 Running code linting using Make..."
        make lint

    - name: Docker Login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      run: |
        echo "🐳 Building and pushing Docker image..."
        echo "Registry: ${{ env.DOCKER_REGISTRY }}"
        echo "Image: ${{ env.DOCKER_IMAGE }}"
        docker build -t ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }} .
        docker build -t ${{ env.DOCKER_IMAGE }}:latest .
        docker push ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
        docker push ${{ env.DOCKER_IMAGE }}:latest
        echo "✅ Docker image pushed successfully!"

    - name: Clean up
      if: always()
      run: |
        docker system prune -f
        echo "🧹 Cleanup completed"