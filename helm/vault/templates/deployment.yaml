{{- if .Values.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: vault-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: vault-system
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      serviceAccountName: vault
      containers:
      - name: vault
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.port }}
        {{- if .Values.dev.enabled }}
        env:
        - name: VAULT_DEV_ROOT_TOKEN_ID
          value: {{ .Values.dev.rootToken | quote }}
        - name: VAULT_DEV_LISTEN_ADDRESS
          value: "0.0.0.0:{{ .Values.service.port }}"
        command:
        - vault
        - server
        - -dev
        - -dev-root-token-id={{ .Values.dev.rootToken }}
        - -dev-listen-address=0.0.0.0:{{ .Values.service.port }}
        {{- end }}
        volumeMounts:
        - name: vault-data
          mountPath: /vault/data
        readinessProbe:
          httpGet:
            path: /v1/sys/health
            port: {{ .Values.service.port }}
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /v1/sys/health
            port: {{ .Values.service.port }}
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: vault-data
        emptyDir: {}
{{- end }}