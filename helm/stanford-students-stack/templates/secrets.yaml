---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: {{ .Values.global.namespace }}
type: Opaque
data:
  POSTGRES_USER: {{ "postgres" | b64enc }}
  POSTGRES_PASSWORD: {{ "postgres" | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: {{ .Values.global.namespace }}
type: Opaque
data:
  DB_USER: {{ "postgres" | b64enc }}
  DB_PASSWORD: {{ "postgres" | b64enc }}