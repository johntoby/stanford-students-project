---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: {{ .Values.global.namespace }}
data:
  DB_HOST: {{ .Values.app.config.dbHost | quote }}
  DB_PORT: {{ .Values.app.config.dbPort | quote }}
  DB_NAME: {{ .Values.app.config.dbName | quote }}
  PORT: {{ .Values.app.port | quote }}
  LOG_LEVEL: {{ .Values.app.config.logLevel | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: {{ .Values.global.namespace }}
data:
  POSTGRES_DB: {{ .Values.database.config.dbName | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: {{ .Values.global.namespace }}
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS students (
        id SERIAL PRIMARY KEY,
        first_name VARCHAR(100) NOT NULL,
        last_name VARCHAR(100) NOT NULL,
        email VARCHAR(100) UNIQUE NOT NULL,
        major VARCHAR(100) NOT NULL,
        gpa DECIMAL(3,2) CHECK (gpa >= 0.0 AND gpa <= 4.0),
        enrollment_date DATE,
        graduation_year INT,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    
    INSERT INTO students (first_name, last_name, email, major, gpa, enrollment_date, graduation_year)
    SELECT 'John', 'Doe', 'john.doe@stanford.edu', 'Computer Science', 3.8, '2021-09-01', 2025
    WHERE NOT EXISTS (SELECT 1 FROM students LIMIT 1);