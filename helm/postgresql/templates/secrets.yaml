{{- if .Values.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-secret-store
  namespace: {{ .Values.global.namespace | default "student-api" }}
spec:
  provider:
    vault:
      server: "http://vault-service.vault-system.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        tokenSecretRef:
          name: "vault-token"
          key: "token"
---
apiVersion: v1
kind: Secret
metadata:
  name: vault-token
  namespace: {{ .Values.global.namespace | default "student-api" }}
type: Opaque
data:
  token: cm9vdA==
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: {{ .Values.global.namespace | default "student-api" }}
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-secret-store
    kind: SecretStore
  target:
    name: postgres-secret
    creationPolicy: Owner
  data:
  - secretKey: POSTGRES_USER
    remoteRef:
      key: database
      property: username
  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: database
      property: password
{{- end }}