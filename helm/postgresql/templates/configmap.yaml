{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: {{ .Values.global.namespace | default "student-api" }}
data:
  POSTGRES_DB: {{ .Values.database.name | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: {{ .Values.global.namespace | default "student-api" }}
data:
  init.sql: |
{{ .Values.initScript | indent 4 }}
{{- end }}