{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: stanford-api-service
  namespace: {{ .Values.global.namespace | default "student-api" }}
spec:
  selector:
    app: stanford-api
  ports:
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.port }}
  type: {{ .Values.service.type }}
{{- end }}