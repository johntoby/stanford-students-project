<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stanford Students Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Stanford University Students Management</h1>
            <p>Computer Science Department</p>
        </header>

        <div class="tabs">
            <button class="tab-button active" onclick="showTab('students-list')">Students List</button>
            <button class="tab-button" onclick="showTab('add-student')">Add Student</button>
        </div>

        <div id="students-list" class="tab-content active">
            <h2>Students List</h2>
            <button onclick="loadStudents()" class="btn btn-primary">Refresh List</button>
            <div id="students-container"></div>
        </div>

        <div id="add-student" class="tab-content">
            <h2>Add New Student</h2>
            <form id="student-form">
                <div class="form-group">
                    <label for="firstName">First Name:</label>
                    <input type="text" id="firstName" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name:</label>
                    <input type="text" id="lastName" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="major">Major:</label>
                    <input type="text" id="major" required>
                </div>
                <div class="form-group">
                    <label for="gpa">GPA:</label>
                    <input type="number" id="gpa" min="0" max="4" step="0.01">
                </div>
                <div class="form-group">
                    <label for="enrollmentDate">Enrollment Date:</label>
                    <input type="date" id="enrollmentDate">
                </div>
                <div class="form-group">
                    <label for="graduationYear">Graduation Year:</label>
                    <input type="number" id="graduationYear" min="2020" max="2030">
                </div>
                <button type="submit" class="btn btn-success">Add Student</button>
            </form>
        </div>

        <div id="edit-modal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeEditModal()">&times;</span>
                <h2>Edit Student</h2>
                <form id="edit-form">
                    <input type="hidden" id="editId">
                    <div class="form-group">
                        <label for="editFirstName">First Name:</label>
                        <input type="text" id="editFirstName" required>
                    </div>
                    <div class="form-group">
                        <label for="editLastName">Last Name:</label>
                        <input type="text" id="editLastName" required>
                    </div>
                    <div class="form-group">
                        <label for="editEmail">Email:</label>
                        <input type="email" id="editEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="editMajor">Major:</label>
                        <input type="text" id="editMajor" required>
                    </div>
                    <div class="form-group">
                        <label for="editGpa">GPA:</label>
                        <input type="number" id="editGpa" min="0" max="4" step="0.01">
                    </div>
                    <div class="form-group">
                        <label for="editEnrollmentDate">Enrollment Date:</label>
                        <input type="date" id="editEnrollmentDate">
                    </div>
                    <div class="form-group">
                        <label for="editGraduationYear">Graduation Year:</label>
                        <input type="number" id="editGraduationYear" min="2020" max="2030">
                    </div>
                    <button type="submit" class="btn btn-primary">Update Student</button>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
